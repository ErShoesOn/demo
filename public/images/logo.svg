<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" aria-label="Majestic Rentals — premium chauffeur-driven car rentals in Nepal">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#e8b84c" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Crown -->
  <path
    d="M 75 30 L 80 14 L 82 22 L 86 10 L 88 22 L 90 14 L 92 22 L 96 12 L 98 24 L 100 12 L 104 24 L 106 14 L 108 22 L 112 10 L 114 22 L 116 14 L 120 30"
    fill="#c9a227"
    stroke="#e8b84c"
    stroke-width="1.5"
  />
  <path d="M 80 22 L 84 28 L 88 22 L 92 28 L 96 22 L 100 28 L 104 22 L 108 28 L 112 22 L 116 28 L 120 22" fill="none" stroke="#e8b84c" stroke-width="1"/>
  <circle cx="92" cy="20" r="2" fill="#e8b84c"/>

  <!-- Shield background -->
  <path
    d="M 45 40 Q 30 40 30 55 L 30 70 Q 30 80 40 80 L 100 80 Q 110 80 110 70 L 110 55 Q 110 40 95 40 Z"
    fill="rgba(201,162,39,0.15)"
    stroke="#c9a227"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- Car silhouette -->
  <path
    d="M 50 62 Q 48 58 52 58 L 56 58 Q 60 58 62 60 L 68 60 Q 72 58 78 58 Q 84 56 88 58 L 96 58 Q 100 56 104 58 Q 108 56 110 60 L 114 60 Q 118 58 122 60 L 130 60 Q 136 58 138 60 L 142 62 Q 145 66 145 70 L 132 70 Q 128 70 126 68 L 118 68 Q 116 70 106 70 L 98 70 Q 96 72 94 68 L 86 68 Q 84 70 74 70 L 66 70 Q 64 72 62 68 L 54 68 Q 52 70 50 70 Z"
    fill="#c9a227"
    filter="url(#dropShadow)"
  />
  <circle cx="64" cy="70" r="4" fill="#0a1422"/>
  <circle cx="130" cy="70" r="4" fill="#0a1422"/>

  <!-- MAJESTIC text -->
  <text x="50" y="88" font-family="Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="1.5" fill="#0a1422" text-anchor="middle">MAJESTIC</text>

  <!-- RENTALS text -->
  <text x="50" y="98" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="url(#goldGrad)" text-anchor="middle">RENTALS</text>
</svg>
